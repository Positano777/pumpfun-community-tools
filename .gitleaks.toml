title = "Community toolbox secret detection"
[extend]
useDefault = true

[[rules]]
id = "solana-contextual-base58-secret"
description = "Possible base58 signing key assigned to a private/secret key field"
regex = '''(?i)(?:private[_-]?key|secret[_-]?key)\s*["']?\s*[:=]\s*["']([1-9A-HJ-NP-Za-km-z]{80,90})["']'''
secretGroup = 1

[[rules]]
id = "solana-contextual-byte-keypair"
description = "Possible 64-byte Solana signing key array"
regex = '''(?i)(?:private[_-]?key|secret[_-]?key|keypair)\s*["']?\s*[:=]\s*(?:new\s+Uint8Array\s*\()?\s*(\[\s*(?:[0-9]{1,3}\s*,\s*){63}[0-9]{1,3}\s*\])'''
secretGroup = 1

[[rules]]
id = "contextual-recovery-phrase"
description = "Possible recovery phrase assigned to a mnemonic/seed phrase field"
regex = '''(?i)(?:mnemonic|seed[_-]?phrase|recovery[_-]?phrase)\s*["']?\s*[:=]\s*["']((?:[a-z]+[ \t]+){11,23}[a-z]+)["']'''
secretGroup = 1
